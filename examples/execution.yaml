name: execution
repo: mcgarylabs/lawndominator-monorepo

checkout_base_dir: /Users/seanmcgary/Code/lawndominator
worktree_dir: .agent-utils/worktrees
# state_dir is optional. When omitted it defaults to
# <project>/.agent-utils/state/<name>, which keeps this loop's tick
# lock and its logs beside the project. Loop state itself lives in
# one database at ~/.agent-utils/state.db, keyed by project, so it
# is not affected by this. Set it only to override that.
default_branch: master

labels:
  trigger:   status:ready-for-execution
  in_flight: status:executing
  blocked:   status:needs-execution-input
  # status:pr-open is not "waiting for a human to read" -- nothing in this chain
  # waits for a human until the very end -- and that is the point. labels.review
  # does two jobs, and a fully automated chain pulls them apart:
  #
  #   1. "the agent finished, go read it". This loop no longer has that state.
  #      Its output goes straight to pr-review, and the human's turn comes only
  #      after remediation, where exec-pr-review-findings applies
  #      status:ready-for-review. That label now means one thing and one loop
  #      applies it. Naming it here as well would summon the human at execution
  #      time, before the branch has been reviewed or fixed -- which is exactly
  #      the pipeline this configuration is trying not to be.
  #
  #   2. TEND ELIGIBILITY. This is the job that survives, and it is why the
  #      field is not simply a placeholder. A loop tends whatever ITS
  #      labels.review names, and this is the only loop that tends.
  #
  # So the label is chosen for job 2 and named for what it actually asserts: a
  # pull request exists for this issue. The agent applies it the moment it opens
  # the pull request, mid-run, and NOTHING ever removes it -- so tending covers
  # the branch continuously from that moment until the issue closes, through the
  # review queue, the remediation queue, the human gate at the end, and any park
  # in between. The veto list below is what pauses it for the two windows where
  # another agent is writing to the branch.
  #
  # Applying it mid-run is safe precisely BECAUSE it is not another loop's
  # trigger. See the terminal below for the label where that distinction is the
  # whole safety property.
  review:    status:pr-open
  # TERMINAL. status:ready-for-pr-review is pr-review's trigger, and THIS LOOP'S
  # AGENT applies it, as its strictly final action. It is not a human gate.
  #
  # There are exactly two human touches on an issue in this pipeline: applying
  # planning's terminal to approve a plan, and merging at the end. Everything
  # between those is machine handoff, and this is the first of them.
  #
  # WHY IT IS SAFE TO CHAIN THIS FIELD WHEN labels.review IS NOT. The hazard is
  # real: a label that is another loop's trigger starts a second agent, and if
  # this agent is still writing to the branch, two agents end up on it, fighting
  # over the files and the labels alike. The protection is not which field it is
  # -- it is WHEN the field is applied. labels.review is applied mid-run, as soon
  # as the pull request opens, because tending should start then. labels.terminal
  # is applied only after the last push, as the last thing the agent does. The
  # prompt below states that ordering explicitly and numbers the steps, because
  # the ordering IS the safety property; the two labels are chained differently
  # because their application contracts are different.
  #
  # It was omitted here until the review loop existed, on the reasoning that an
  # issue leaves execution when its pull request merges. That reasoning is fine
  # as prose and wrong as configuration, because labels.terminal is also the
  # pipeline GRAPH. internal/config/entryloop.go picks the front of the pipeline
  # as "the loop whose trigger is no OTHER loop's terminal or review label";
  # with this field empty, pr-review's trigger is nobody's terminal, so pr-review
  # resolves as a SECOND entry loop, the resolution is ambiguous, and the epic
  # sweep is silently disabled for the whole project (internal/loopcmd/
  # epicsweep.go logs a warning and promotes nothing). Declaring it is what
  # makes the four-loop chain single-entry.
  #
  # Deliberately NOT repeated under veto, unlike planning's terminal. Vetoing a
  # label also disables TENDING on it, and an issue queued for review is exactly
  # a pull request that should keep being rebased while it waits.
  terminal:  status:ready-for-pr-review
  veto:
    - "blocked:*"
    # The states the REVIEW and REMEDIATION loops own. veto is checked before
    # tend decisions too (internal/engine/engine.go), and these two entries are
    # the ONLY thing standing between a tend rebase and another agent's push.
    # status:pr-open is on the issue from the moment the pull request opens and
    # is never removed, so without these the tend would fire straight through
    # the review and remediation windows -- the reviewer commits its
    # mechanical-gate fixes, and the remediation loop force-pushes a whole round
    # of them. Removing either entry reintroduces that race silently.
    - status:pr-reviewing
    - status:fixing-findings

agent:
  # Sonnet at medium effort. Execution consumes a plan that a senior model
  # already wrote and a human already approved, so its work is specified rather
  # than derived -- the same reason the remediation loop runs sonnet against a
  # prescriptive findings artifact. When the executor struggles, the fix is a
  # better plan, not a more expensive executor.
  model: sonnet
  effort: medium
  permission_mode: bypassPermissions
  worktree: per_issue
  # No cost ceiling, and written out rather than omitted so it reads as a
  # decision. A budget cap does not stop an expensive run; it stops it PART WAY
  # THROUGH, which is the one outcome worth avoiding. The dispatch is recorded
  # failed with its work half-applied and unpushed, the loop retries it from a
  # resumed session, and the retry re-spends what the cap just refused. Cost is
  # controlled here by model and effort, which shape the whole run, and by the
  # findings artifact that keeps the expensive half short -- not by a ceiling
  # that lands mid-edit.
  #
  # 0 means no ceiling: internal/runner/args.go omits --max-budget-usd for it.
  # A negative value is rejected, because it would reach that same "> 0" gate
  # and be silently identical to no cap.
  max_budget_usd: 0
  # Omitting this would default it to 24h; it is written out for the same reason
  # as the line above. This is a last-resort bound on a wedged process, not a
  # budget: a stuck dispatch is caught by the orphan breaker and `loop kill`,
  # both of which act on evidence rather than a clock. Guessing low is the
  # expensive mistake, because a killed dispatch is recorded FAILED and retried,
  # so a real long run looks like a flaky agent.
  timeout: 24h

# tend: lets a tend dispatch (the automatic rebase, and the review-reply below)
# run a cheaper model than the build itself, since its job is smaller. Falls
# back to agent's own harness/model/effort for any field left unset, and a
# harness:/model:/effort: label on the issue still beats this. See
# docs/configuration.md#tend.
# tend:
#   model: sonnet

i_understand_bypass_permissions: true
tend_pr: true

retry:
  max: 3
  backoff: [0s, 15m, 30m]
  breaker:
    orphan_threshold: 2
    cooldown: 30m

prompt: |
  Run the build-feature skill for GitHub issue #{{.Issue.Number}}, repo {{.Repo}},
  in ISSUE MODE. The issue carries {{.Labels.Trigger}}, which is the human's
  approval of a plan already posted in the issue comments. Follow build-feature
  EXACTLY, with these overrides.

  YOU OWN THE LABELS. As your first action, remove {{.Labels.Trigger}} and add
  {{.Labels.InFlight}}.

  WORKTREE AND PUSH DISCIPLINE. You run in an isolated git worktree, checked out
  detached at the default branch. Resolve the branch yourself as build-feature's
  phase 0 describes: check out the EXISTING remote feature branch if one exists
  and never re-create it over the design assets, then rebase onto the default
  branch. A rebase conflict is ordinary work: resolve it yourself when you can
  say what each side changes and why, the two sides touch different behavior so
  keeping both is coherent, and both sides' tests over the conflicted files pass
  after your resolution. State the resolution and its reasoning in your next
  comment. PARK with a comment listing the conflicted files only when the sides
  disagree about the SAME behavior, you cannot tell what a side was for, or you
  cannot get both sides' tests green. Never force and never guess.
  At the END of every phase AND before every park: commit and
  `git push -u origin <branch>`. Your worktree may be removed before your next
  dispatch, so unpushed work is lost.

  A FRESH WORKTREE HAS NO node_modules. Run `pnpm install` before any Node gate.

  HEADLESS. Never ask the human through the CLI and never block on a reply. All
  human interaction is issue comments plus label transitions. Read the issue body
  and comments, including the posted plan, as your specification.

  PARKING ON BLOCKERS. On any of build-feature's five blockers, PARK: commit and
  push, post a comment stating exactly what you need, remove
  {{.Labels.InFlight}}, add {{.Labels.Blocked}}, and stop. End the comment with:
  "To proceed: comment your decision and re-add the {{.Labels.Trigger}} label."
  Never guess on a genuine blocker.

  ON COMPLETION, IN THIS ORDER. The order is the whole safety property of the
  handoff, because {{.Labels.Terminal}} is the REVIEW loop's trigger. Applying it
  while you are still working starts a review agent on a branch you are still
  writing to, and two agents on one branch fight over the files and the labels
  alike. Read the numbers as a sequence, not a checklist.
    1. Open the pull request, or promote plan-feature's draft, with
       "Closes #{{.Issue.Number}}" in the body. Assign @seanmcgary.
    2. Add {{.Labels.Review}}. This says a pull request EXISTS. It does NOT say
       you have finished, and it is not another loop's trigger, so it is safe to
       apply here and it is deliberately applied early: it is what makes the
       branch eligible for rebasing while it waits, from now until the issue
       closes.
    3. Finish the rest of build-feature -- including the pull request feedback
       loop. Keep the "## Pipeline State" block current at every phase
       transition.
    4. Push everything: `git push -u origin <branch>`. Nothing you have not
       pushed exists.
    5. Remove {{.Labels.InFlight}}.
    6. Add {{.Labels.Terminal}}. THIS IS YOUR LAST ACTION. Nothing follows it --
       no push, no commit, no comment, no other label. If you find yourself with
       more work to do after this step, you applied it too early.
  Do NOT add status:ready-for-review. That label means the whole pipeline is
  finished and it is the human's turn to merge, and the loop at the END of the
  chain applies it. Your work is followed by review and then remediation.

  NEVER MERGE. Merging is the human's decision, at every stage, without exception.

resume_prompt: |
  Issue #{{.Issue.Number}} in {{.Repo}} carries {{.Labels.Trigger}} again. You are
  in the SAME session you used before, so you already know what you built and why.
  Remove {{.Labels.Trigger}} and add {{.Labels.InFlight}} as your first action.

  Read the comments added since your last message. They answer the blocker you
  parked on, or they ask for more work on a pull request you already opened.

  Resume from your "## Pipeline State" block. Re-check out your branch and rebase
  it onto the default branch before you continue. All other rules from your
  original instructions still apply, including push discipline, the numbered
  completion order, that {{.Labels.Terminal}} is your strictly last action, and
  never merging.

tend_prompt: |
  You are TENDING pull request #{{.PR.Number}} for issue #{{.Issue.Number}} in
  {{.Repo}}. It is {{.PR.BehindBy}} commits behind {{.PR.BaseRef}}.

  This is maintenance on a finished feature, NOT new feature work. Do not add
  scope. Do not refactor beyond the rebase and, when it applies below, the
  review reply. NEVER merge or close the pull request. Do not change any label
  unless you park.

  You run in an isolated git worktree checked out detached at
  origin/{{.PR.HeadRef}}. Its path is {{.Worktree}}, and it is NOT the worktree
  you built this branch in. You are resuming the session that did that work, so
  your memory holds the old path: use the one named here and re-read any file
  before you act on what you remember of it.

  1. `git fetch origin`, then rebase onto origin/{{.PR.BaseRef}}.
  2. If the rebase is clean, push with
     `git push --force-with-lease origin HEAD:refs/heads/{{.PR.HeadRef}}`.
     Use --force-with-lease, never plain --force. If the lease check REJECTS the
     push, another run touched the branch: change nothing and stop.
  3. If the rebase CONFLICTS, resolve it yourself when all three hold: you can
     say what each side changes and why, the two sides touch different behavior
     so keeping both is coherent, and both sides' tests over the conflicted
     files pass after your resolution. Then push as step 2 describes and state
     the resolution and its reasoning in your comment. Otherwise -- the sides
     disagree about the SAME behavior, you cannot tell what a side was for, or
     you cannot get both sides' tests green -- run `git rebase --abort` and PARK
     with a comment listing the conflicted files. Never resolve by guessing.

  {{if .PR.ReviewPending}}
  4. This dispatch was also triggered by review activity newer than the last
     tend. After the rebase (or the park) above, read the pull request's
     unresolved review threads and comments. Answer each one: reply with your
     reasoning, and push a fix when the reviewer is right. Leave a thread
     unresolved when you disagree; say why in your reply rather than resolving
     it yourself. Do not resolve a thread a human, not you, opened unless your
     reply settles it and the reviewer's own tooling would mark it so.
  {{end}}

  PARK means: post the comment, remove {{.Labels.Review}}, add
  {{.Labels.Blocked}}, and stop. End with: "To proceed: comment your decision and
  re-add the {{.Labels.Trigger}} label."

  {{if not .PR.ReviewPending}}
  If the branch turns out to be current, post NO comment and make NO push.
  Silence is the correct output for a quiet pull request.
  {{end}}

name: execution
repo: mcgarylabs/lawndominator-monorepo

checkout_base_dir: /Users/seanmcgary/Code/lawndominator
worktree_dir: .agent-utils/worktrees
# state_dir is optional. When omitted it defaults to
# <project>/.agent-utils/state/<name>, which keeps this loop's tick
# lock and its logs beside the project. Loop state itself lives in
# one database at ~/.agent-utils/state.db, keyed by project, so it
# is not affected by this. Set it only to override that.
default_branch: master

labels:
  trigger:   status:ready-for-execution
  in_flight: status:executing
  blocked:   status:needs-execution-input
  # TERMINAL. Every loop ends the same way: apply this, stop. It is the only
  # label a loop declares that says anything about what happens next, and even
  # then it does not name the next loop -- it names a STATE. That pr-review
  # happens to trigger on the same state is a fact about the labels an operator
  # chose, not a dependency declared here or there.
  #
  # THE ORDER IS THE SAFETY PROPERTY. Because another loop does trigger on this
  # state, applying it while this agent is still writing to the branch starts a
  # second agent on that branch, and the two fight over the files and the labels
  # alike. The prompt below numbers the completion steps for exactly that reason:
  # the terminal is applied after the last push, and nothing follows it.
  terminal:  status:ready-for-pr-review
  veto:
    - "blocked:*"
    # This loop's own terminal, so a re-applied trigger cannot pull back an
    # issue already handed to the reviewer, plus the states the review and
    # remediation loops own.
    - status:ready-for-pr-review
    - status:pr-reviewing
    - status:fixing-findings

agent:
  # Sonnet at medium effort. Execution consumes a plan that a senior model
  # already wrote and a human already approved, so its work is specified rather
  # than derived -- the same reason the remediation loop runs sonnet against a
  # prescriptive findings artifact. When the executor struggles, the fix is a
  # better plan, not a more expensive executor.
  model: sonnet
  effort: medium
  permission_mode: bypassPermissions
  worktree: per_issue
  # No cost ceiling, and written out rather than omitted so it reads as a
  # decision. A budget cap does not stop an expensive run; it stops it PART WAY
  # THROUGH, which is the one outcome worth avoiding. The dispatch is recorded
  # failed with its work half-applied and unpushed, the loop retries it from a
  # resumed session, and the retry re-spends what the cap just refused. Cost is
  # controlled here by model and effort, which shape the whole run, and by the
  # findings artifact that keeps the expensive half short -- not by a ceiling
  # that lands mid-edit.
  #
  # 0 means no ceiling: internal/runner/args.go omits --max-budget-usd for it.
  # A negative value is rejected, because it would reach that same "> 0" gate
  # and be silently identical to no cap.
  max_budget_usd: 0
  # Omitting this would default it to 24h; it is written out for the same reason
  # as the line above. This is a last-resort bound on a wedged process, not a
  # budget: a stuck dispatch is caught by the orphan breaker and `loop kill`,
  # both of which act on evidence rather than a clock. Guessing low is the
  # expensive mistake, because a killed dispatch is recorded FAILED and retried,
  # so a real long run looks like a flaky agent.
  timeout: 24h

# Tending is NOT configured here, and no loop configures it. It lives in the
# PROJECT descriptor, .agent-utils/config.yaml, because it describes a
# repository's open pull requests rather than this loop's issue lifecycle:
#
#   tend:
#     enabled: true
#     loop:    exec-pr-review-findings
#     label:   status:ready-for-review
#     model:   sonnet
#
# `loop` names which loop's rows host the dispatches, and it is the LAST loop in
# the chain -- the one whose terminal the pull request is sitting at while it
# waits for a human. See docs/configuration.md#tend.
i_understand_bypass_permissions: true

retry:
  max: 3
  backoff: [0s, 15m, 30m]
  breaker:
    orphan_threshold: 2
    cooldown: 30m

prompt: |
  Run the build-feature skill for GitHub issue #{{.Issue.Number}}, repo {{.Repo}},
  in ISSUE MODE. The issue carries {{.Labels.Trigger}}, which is the human's
  approval of a plan already posted in the issue comments. Follow build-feature
  EXACTLY, with these overrides.

  YOU OWN THE LABELS. As your first action, remove {{.Labels.Trigger}} and add
  {{.Labels.InFlight}}.

  WORKTREE AND PUSH DISCIPLINE. You run in an isolated git worktree, checked out
  detached at the default branch. Resolve the branch yourself as build-feature's
  phase 0 describes: check out the EXISTING remote feature branch if one exists
  and never re-create it over the design assets, then rebase onto the default
  branch. A rebase conflict is ordinary work: resolve it yourself when you can
  say what each side changes and why, the two sides touch different behavior so
  keeping both is coherent, and both sides' tests over the conflicted files pass
  after your resolution. State the resolution and its reasoning in your next
  comment. PARK with a comment listing the conflicted files only when the sides
  disagree about the SAME behavior, you cannot tell what a side was for, or you
  cannot get both sides' tests green. Never force and never guess.
  At the END of every phase AND before every park: commit and
  `git push -u origin <branch>`. Your worktree may be removed before your next
  dispatch, so unpushed work is lost.

  A FRESH WORKTREE HAS NO node_modules. Run `pnpm install` before any Node gate.

  HEADLESS. Never ask the human through the CLI and never block on a reply. All
  human interaction is issue comments plus label transitions. Read the issue body
  and comments, including the posted plan, as your specification.

  PARKING ON BLOCKERS. On any of build-feature's five blockers, PARK: commit and
  push, post a comment stating exactly what you need, remove
  {{.Labels.InFlight}}, add {{.Labels.Blocked}}, and stop. End the comment with:
  "To proceed: comment your decision and re-add the {{.Labels.Trigger}} label."
  Never guess on a genuine blocker.

  ON COMPLETION, IN THIS ORDER. The order is the whole safety property of the
  handoff, because {{.Labels.Terminal}} is the REVIEW loop's trigger. Applying it
  while you are still working starts a review agent on a branch you are still
  writing to, and two agents on one branch fight over the files and the labels
  alike. Read the numbers as a sequence, not a checklist.
    1. Open the pull request, or promote plan-feature's draft, with
       "Closes #{{.Issue.Number}}" in the body. Assign @seanmcgary.
    2. Finish the rest of build-feature -- including the pull request feedback
       loop. Keep the "## Pipeline State" block current at every phase
       transition.
    3. Push everything: `git push -u origin <branch>`. Nothing you have not
       pushed exists.
    4. Remove {{.Labels.InFlight}}.
    5. Add {{.Labels.Terminal}}. THIS IS YOUR LAST ACTION. Nothing follows it --
       no push, no commit, no comment, no other label. If you find yourself with
       more work to do after this step, you applied it too early.
  {{.Labels.Terminal}} is the ONLY label you add at the end. In particular do not
  add status:ready-for-review: that means the whole pipeline is finished and it
  is the human's turn to merge, and the loop at the END of the chain applies it.
  Your work is followed by review and then remediation.

  NEVER MERGE. Merging is the human's decision, at every stage, without exception.

resume_prompt: |
  Issue #{{.Issue.Number}} in {{.Repo}} carries {{.Labels.Trigger}} again. You are
  in the SAME session you used before, so you already know what you built and why.
  Remove {{.Labels.Trigger}} and add {{.Labels.InFlight}} as your first action.

  Read the comments added since your last message. They answer the blocker you
  parked on, or they ask for more work on a pull request you already opened.

  Resume from your "## Pipeline State" block. Re-check out your branch and rebase
  it onto the default branch before you continue. All other rules from your
  original instructions still apply, including push discipline, the numbered
  completion order, that {{.Labels.Terminal}} is your strictly last action, and
  never merging.
